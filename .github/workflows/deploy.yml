name: Deploy para Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            cd /etc/easypanel/projects/saas/jornada-zion/code
            git pull origin main
            docker build \
              --build-arg VITE_SUPABASE_URL=https://rbaaljzkbdorgyylkiqh.supabase.co \
              --build-arg VITE_SUPABASE_ANON_KEY=sb_publishable_E8zhVZ8IXjW5iUBoeWuiGA_S82Pkrnz \
              -t easypanel/saas/jornada-zion:latest .
            docker service update --image easypanel/saas/jornada-zion:latest saas_jornada-zion
